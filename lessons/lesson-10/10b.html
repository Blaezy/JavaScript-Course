<!DOCTYPE html>
<html>
  <head>
    <title>DOM with css 10b</title>
    <style>
      body {
        background-color: #1e1e1e;
        color: white;
      }
      .calculate-button {
        color: white;
        background-color: green;
        padding: 12px 15px;
        border: none;
        cursor: pointer;
      }
      .cost-input {
        padding: 10px;
      }
      .cost-input:focus {
        outline-color: green;
      }
    </style>
  </head>
  <body>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input
      class="cost-input js-input"
      type="number"
      placeholder="Cost of order"
      onkeydown="inputKeyDown(event);"
    />
    <button class="calculate-button" onclick="costCalculate();">
      Calculate
    </button>

    <p class="js-totalCost"></p>

    <script>
      function costCalculate() {
        const inputElement = document.querySelector(".js-input");
        let cost = inputElement.value;
        // console.log(cost);
        cost = cost * 100;

        if (cost < 4000) {
          cost = cost + 1000;
        }

        cost = cost / 100;
        document.querySelector(
          ".js-totalCost"
        ).innerHTML = `Your Total Cost : $${cost}`;
      }

      function inputKeyDown(event) {
        if (event.key === "Enter") costCalculate();
      }
    </script>
  </body>
</html>
