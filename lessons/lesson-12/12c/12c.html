<!DOCTYPE html>
<html>
  <head>
    <title>Dom with css 12c</title>
    <link rel="stylesheet" href="12c.css" />
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button" title="Rock">
      <img class="move-image" src="../../../images/rock-emoji.png" />
    </button>

    <button class="move-button js-paper-button" title="Paper">
      <img class="move-image" src="../../../images/paper-emoji.png" />
    </button>

    <button class="move-button js-scissor-button" title="Scissors">
      <img class="move-image" src="../../../images/scissors-emoji.png" />
    </button>

    <p class="js-result result-para"></p>
    <p class="js-moves moves-para"></p>

    <p class="js-score score-para">
      `Your Score: Wins: 0 , Losses: 0 , Tie: 0`
    </p>

    <button class="reset-button js-reset-button">Reset Score</button>
    <button class="auto-play-button js-autoplay-button">Auto Play</button>

    <script src="12c.js"></script>
  </body>
</html>
