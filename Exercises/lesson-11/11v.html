<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 11v</title>
  </head>
  <body>
    <script>
        
        function FizzBuzz(num1,num2){
            const arr = [];
            for(let i=1; i<=20; i++){

                if(i%num1 === 0 && i%num2 === 0){
                    arr.push("FizzBuzz");
                }else if(i%num1 === 0){
                    arr.push("Fizz");
                }else if(i%num2 === 0 ){
                    arr.push("Buzz");
                }else {
                    arr.push(i);
                }
            }
            return arr;
        }

        console.log(FizzBuzz(3,5));
    </script>
  </body>
</html>
