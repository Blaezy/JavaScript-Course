    <script>
      const num1 = [2, 4, 5, 7, 8, -10, 12];
      const num2 = [20, 40, -50, 70, -8];

      function countPositive(arr) {
        let total = 0;
        let i = 0;
        while (i < arr.length) {
          if (arr[i] >= 0) {
            total++;
          }
          i++;
        }
        return total;
      }
      console.log(countPositive(num1));
    </script>
