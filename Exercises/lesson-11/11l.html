    <script>
      const num1 = [2, 4, 5, 7, 8, -10, 12];
      const num2 = [20, 40, -50, 70, -8];
      const num3 = [];
      const num4 = [22];

      function minMax(arr) {
        let min = arr[0];
        let max = arr[0];

        let i = 0;
        while (i < arr.length) {
          if (arr[i] <= min) {
            min = arr[i];
          }
          if (arr[i] >= max) {
            max = arr[i];
          }
          i++;
        }
        return {min,max};
      }
      console.log(minMax(num2));
    </script>
