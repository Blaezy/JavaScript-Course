<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 11i</title>
  </head>
  <body>
    <script>
      const nums = [2, 4, 5, 7, 8];
      const nums2 = [20, 40, -50, 70, -8];

      function addOne(arr,num) {
        const newNum = [];
        for (let i = 0; i < arr.length; i++) {
          newNum[i] = arr[i] + num;
        }
        return newNum;
      }
      console.log(nums);
      console.log(addOne(nums,2));
      console.log(nums2);
      console.log(addOne(nums2,4));
    </script>
  </body>
</html>
