    <script>
      <!-- new: for loop 0 to 10 (0,2,4,...,10)  -->

      for(let i=0; i<=10; i+=2){
        console.log(i);
      }

      // <!-- new: for loop 5 to 0 down -->

      for(let i=5; i>=0; i--){
        console.log(i);
      }
