<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 11h</title>
  </head>
  <body>
    <script>
      const nums = [2, 4, 5, 7, 8];
      const nums2 = [20, 40, -50, 70, -8];

      function addOne(arr) {
        const newNum = [];
        for (let i = 0; i < arr.length; i++) {
          newNum[i] = arr[i] + 1;
        }
        return newNum;
      }

      console.log(addOne(nums));
      console.log(addOne(nums2));
    </script>
  </body>
</html>
