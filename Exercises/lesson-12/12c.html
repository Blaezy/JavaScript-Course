<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 12c</title>
    </head>
    <body>

        <button class="start-button-js" >Start!</button>

        <script>
            const buttonElement = document.querySelector(".start-button-js");

            const changeText = ()=>{buttonElement.innerHTML = "Finished!";}

            buttonElement.addEventListener('click',startTime)

            function startTime(){
                setTimeout(changeText,1000);
            }

        </script>
    </body>
</html>
