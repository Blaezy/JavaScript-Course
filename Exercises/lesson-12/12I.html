<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 12i</title>
  </head>
  <body>
    <button class="start-js">start</button>
    <button class="stop-js">stop</button>
    <button class="add-js">Add</button>
    <button class="remove-js">Remove</button>
    <script>
      const startButtonElement = document.querySelector(".start-js");
      const stopButtonElement = document.querySelector(".stop-js");
      const addButtonElement = document.querySelector(".add-js");
      const removeButtonElement = document.querySelector(".remove-js");

      startButtonElement.addEventListener("click", startButton);
      stopButtonElement.addEventListener("click", stopButton);
      addButtonElement.addEventListener("click", () => num++);
      removeButtonElement.addEventListener("click", () => num--);

      let intervalID;
      let num = 2;

      function startButton() {
        const changeTitle = function () {
          if (num > 0) document.title = `(${num}) New Message`;
          else document.title = "Exercise 12i";
        };
        intervalID = setInterval(changeTitle, 1000);
      }

      function stopButton() {
        clearInterval(intervalID);
        document.title = "stoped";
      }
    </script>
  </body>
</html>
