<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 12f</title>
  </head>
  <body>
    <button class="add-button-js">Add to Cart</button>
    <p class="display-para-js"></p>

    <script>
      const paragraphElement = document.querySelector(".display-para-js");
      const buttonElement = document.querySelector(".add-button-js");
      buttonElement.addEventListener("click", startTime);
      let timeoutID;

      const removeText = () => {
        paragraphElement.innerHTML = "";
      };

      function startTime() {
        clearInterval(timeoutID);
        paragraphElement.innerHTML = "Added";
        timeoutID = setTimeout(removeText, 2000);
      }
    </script>
  </body>
</html>
