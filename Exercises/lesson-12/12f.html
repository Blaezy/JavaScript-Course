<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 12f</title>
  </head>
  <body>
    <button class="add-button-js" onclick="startTime();">Add to Cart</button>
    <p class="display-para-js"></p>

    <script>
      const buttonElement = document.querySelector(".display-para-js");
      let timeoutID;

      const removeText = function () {
        buttonElement.innerHTML = "";
      };

      function startTime() {
        clearInterval(timeoutID);
        buttonElement.innerHTML = "Added";
        timeoutID = setTimeout(removeText, 2000);
      }
    </script>
  </body>
</html>
